          LAUNCHER = Path('os/android/app/src/main/java/com/libertyrecomp/LauncherActivity.java')
          MARKER = 'SN512A-MEMORY-AUDIO-V4'
          
          
          def replace_once(source: str, original: str, new: str, label: str) -> str:
              occurrences = source.count(original)
              if occurrences != 1:
                  raise RuntimeError(f'{label}: expected 1 matching source anchor, got {occurrences}. '
                                     'Upstream may have changed. No files have been modified.')
              return source.replace(original, new, 1)
          
          
