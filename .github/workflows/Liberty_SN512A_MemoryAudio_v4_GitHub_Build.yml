              # Users' existing cvar overrides still take precedence over this fallback.
              src = replace_once(
                  src,
                  'gta4_native_texture_memory_limit_mb, 0, "GTA IV/Graphics/Native Renderer",',
                  'gta4_native_texture_memory_limit_mb, REX_PLATFORM_ANDROID ? 384 : 0, '
                  '"GTA IV/Graphics/Native Renderer",',
                  'Android-only default native texture cache budget')
          
              src = replace_once(
                  src,
                  'namespace rex::graphics::gta4_native {\nnamespace {',
                  '''// SN512A-MEMORY-AUDIO-V4: Lower-memory fallback for BC2/BC3 on non-BC Vulkan GPUs.
          // Re-encoding to ASTC is intentionally NOT implemented by this switch.
          // This 4-4-4-4 path is lossy; keep it user-configurable and capability-checked.
          REXCVAR_DEFINE_BOOL(gta4_mali_dxt35_rgba4, true, "GTA IV/Graphics/Native Renderer",
                              "On BC-incompatible GPUs, decode BC2/BC3 to 16-bit RGBA4 instead of 32-bit RGBA8")
              .lifecycle(rex::cvar::Lifecycle::kRequiresRestart);
          namespace rex::graphics::gta4_native {
          namespace {''',
                  'experimental graphics cvar')
          
              src = replace_once(
                  src,
                  'std::atomic<bool> g_decode_dxt1_to_a1r5g5b5{false};',
                  '''std::atomic<bool> g_decode_dxt1_to_a1r5g5b5{false};
          // SN512A-MEMORY-AUDIO-V4: BC2/BC3 to 16-bit RGBA4 where sampled+upload supported.
          std::atomic<bool> g_decode_dxt35_to_rgba4{false};
          // Decode one 4x4 BC2 or BC3 block into a small scratch area, then quantize
          // 8-bit RGBA channels to 4 bits each and write the *Vulkan R4G4B4A4* order.
          // BC2/3 are 16 bytes/4x4; RGBA4 is 32 bytes/4x4 instead of RGBA8's 64.
          inline void DecodeDxt35ToR4G4B4A4(xenos::TextureFormat base_format, xenos::Endian endian,
                                              void* destination, const void* source, size_t pitch) {
            uint8_t rgba[4 * 4 * 4] = {};
            if (base_format == xenos::TextureFormat::k_DXT2_3) {
              texture_conversion::ConvertTexelDXT2_3ToR8G8B8A8(endian, rgba, source, 4 * 4);
            } else {
              texture_conversion::ConvertTexelDXT4_5ToR8G8B8A8(endian, rgba, source, 4 * 4);
            }
            auto* output = static_cast<uint8_t*>(destination);
            for (size_t y = 0; y < 4; ++y) {
              for (size_t x = 0; x < 4; ++x) {
                const uint8_t* color = rgba + (y * 4 + x) * 4;
                const uint16_t packed = uint16_t((uint16_t(color[0] >> 4) << 12) |
                                                 (uint16_t(color[1] >> 4) << 8) |
                                                 (uint16_t(color[2] >> 4) << 4) |
                                                 uint16_t(color[3] >> 4));
                std::memcpy(output + y * pitch + x * 2, &packed, sizeof(packed));
              }
            }
          }''',
                  'DXT3/5 quantizer helper')
          
              src = replace_once(
                  src,
                  '''  const bool dxt1_16bit = !supported && format_usable(VK_FORMAT_A1R5G5B5_UNORM_PACK16);
            g_decode_dxt_textures.store(!supported, std::memory_order_relaxed);
            g_decode_dxt1_to_a1r5g5b5.store(dxt1_16bit, std::memory_order_relaxed);''',
                  '''  const bool dxt1_16bit = !supported && format_usable(VK_FORMAT_A1R5G5B5_UNORM_PACK16);
            const bool dxt35_16bit = !supported && REXCVAR_GET(gta4_mali_dxt35_rgba4) &&
                                     format_usable(VK_FORMAT_R4G4B4A4_UNORM_PACK16);
            g_decode_dxt_textures.store(!supported, std::memory_order_relaxed);
            g_decode_dxt1_to_a1r5g5b5.store(dxt1_16bit, std::memory_order_relaxed);
            g_decode_dxt35_to_rgba4.store(dxt35_16bit, std::memory_order_relaxed);''',
                  'Vulkan format capability selection')
          
              src = replace_once(
                  src,
                  '''                 "CPU (DXT1 to {}, DXT3/DXT5 to R8G8B8A8)",
                           dxt1_16bit ? "A1R5G5B5" : "R8G8B8A8");''',
                  '''                 "CPU (DXT1 to {}, DXT3/DXT5 to {})",
                           dxt1_16bit ? "A1R5G5B5" : "R8G8B8A8",
                           dxt35_16bit ? "R4G4B4A4" : "R8G8B8A8");''',
                  'DXT cache conversion logging')
          
              src = replace_once(
                  src,
                  '''  if (IsDecodedDxtFormat(GetBaseFormat(format))) {
              return GetBaseFormat(format) == xenos::TextureFormat::k_DXT1 &&
                             g_decode_dxt1_to_a1r5g5b5.load(std::memory_order_relaxed)
                         ? VK_FORMAT_A1R5G5B5_UNORM_PACK16
                         : VK_FORMAT_R8G8B8A8_UNORM;
            }''',
                  '''  if (IsDecodedDxtFormat(GetBaseFormat(format))) {
              const auto base = GetBaseFormat(format);
              if (base == xenos::TextureFormat::k_DXT1 &&
                  g_decode_dxt1_to_a1r5g5b5.load(std::memory_order_relaxed)) {
                return VK_FORMAT_A1R5G5B5_UNORM_PACK16;
              }
              if ((base == xenos::TextureFormat::k_DXT2_3 ||
                   base == xenos::TextureFormat::k_DXT4_5) &&
                  g_decode_dxt35_to_rgba4.load(std::memory_order_relaxed)) {
                return VK_FORMAT_R4G4B4A4_UNORM_PACK16;
              }
              return VK_FORMAT_R8G8B8A8_UNORM;
            }''',
                  'texture-to-Vulkan format mapping')
          
              src = replace_once(
                  src,
                  '''  const bool decode_dxt1_16bit = decode_dxt && base_format == xenos::TextureFormat::k_DXT1 &&
                                            g_decode_dxt1_to_a1r5g5b5.load(std::memory_order_relaxed);
            const FormatInfo* host_format_info =
                decode_dxt1_16bit ? FormatInfo::Get(uint32_t(xenos::TextureFormat::k_1_5_5_5))
                : decode_dxt     ? FormatInfo::Get(uint32_t(xenos::TextureFormat::k_8_8_8_8))''',
                  '''  const bool decode_dxt1_16bit = decode_dxt && base_format == xenos::TextureFormat::k_DXT1 &&
                                            g_decode_dxt1_to_a1r5g5b5.load(std::memory_order_relaxed);
            const bool decode_dxt35_16bit = decode_dxt &&
                (base_format == xenos::TextureFormat::k_DXT2_3 ||
                 base_format == xenos::TextureFormat::k_DXT4_5) &&
                g_decode_dxt35_to_rgba4.load(std::memory_order_relaxed);
            const FormatInfo* host_format_info =
                decode_dxt1_16bit ? FormatInfo::Get(uint32_t(xenos::TextureFormat::k_1_5_5_5))
                : decode_dxt35_16bit ? FormatInfo::Get(uint32_t(xenos::TextureFormat::k_4_4_4_4))
                : decode_dxt     ? FormatInfo::Get(uint32_t(xenos::TextureFormat::k_8_8_8_8))''',
                  'texture memory layout/bytes per texel')
          
              src = replace_once(
                  src,
                  '''                 if (decode_dxt1_16bit) {
                             texture_conversion::ConvertTexelDXT1ToA1R5G5B5(info.endianness, texels,
                                                                            source_block, destination_pitch);
                           } else if (base_format == xenos::TextureFormat::k_DXT1) {''',
                  '''                 if (decode_dxt1_16bit) {
                             texture_conversion::ConvertTexelDXT1ToA1R5G5B5(info.endianness, texels,
                                                                            source_block, destination_pitch);
                           } else if (decode_dxt35_16bit) {
                             DecodeDxt35ToR4G4B4A4(base_format, info.endianness, texels,
                                                    source_block, destination_pitch);
                           } else if (base_format == xenos::TextureFormat::k_DXT1) {''',
                  'on-demand 16-bit texture decode')
          
              assert src.count('SN512A-MEMORY-AUDIO-V4') >= 2
              return src
          
          
          def patch_pool(src: str) -> str:
              if MARKER in src:
                  return src
              return replace_once(
                  src,
                  '    worker_count_ = cores > 2 ? std::min(cores - 1, 6u) : 0;',
                  '''    // SN512A-MEMORY-AUDIO-V4: leave CPU headroom for guest audio mixing,
              // XMA decode and graphics; the calling thread also participates.
              worker_count_ = cores > 2 ? std::min(cores - 2, 3u) : 0;''',
                  'BC texture decode worker cap')
          
          
          
          def patch_audio_system(src: str) -> str:
              if MARKER in src:
                  return src
              # WaitAny has already blocked for up to 500 ms. A SECOND 500 ms sleep on
              # timeout makes the guest mixer unresponsive when a producer resumes in
              # that second sleep. Only back off briefly on *failed* waits.
              return replace_once(
                  src,
                  '''    if (!pumped) {
                SCOPE_profile_cpu_i("apu", "Sleep");
                rex::thread::Sleep(std::chrono::milliseconds(500));
              }''',
                  '''    // SN512A-MEMORY-AUDIO-V4: WaitAny() itself blocks on normal timeout.
              // Don't add a second 500 ms sleep that delays newly ready audio frames.
              if (!pumped && result.first == rex::thread::WaitResult::kFailed) {
                SCOPE_profile_cpu_i("apu", "Audio wait failure backoff");
                rex::thread::Sleep(std::chrono::milliseconds(1));
              }''',
                  'audio producer timeout wakeup')
          
          
          def patch_launcher(src: str) -> str:
              if MARKER in src:
                  return src
              return replace_once(
                  src,
                  'new GraphicsSetting("Touch controls",',
                  '''// SN512A-MEMORY-AUDIO-V4: opt-out switches. Existing saved selections untouched.
                    new GraphicsSetting("16-bit alpha textures", "Reduce decoded DXT3/5 memory; possible color/alpha banding",
                        new String[] {"gta4_mali_dxt35_rgba4"},
                        new String[] {"Default", "Save RAM (16-bit)", "Original color (32-bit)"},
                        new String[] {"true", "false"}),
                    new GraphicsSetting("GPU texture cache budget", "Limits sampled-texture cache; small cap may increase pop-in",
                        new String[] {"gta4_native_texture_memory_limit_mb"},
                        new String[] {"Default", "256 MB", "384 MB", "512 MB", "768 MB", "Driver budget"},
                        new String[] {"256", "384", "512", "768", "0"}),
                    new GraphicsSetting("Touch controls",''',
                  'memory controls in GUI')
          
          
          def main() -> None:
