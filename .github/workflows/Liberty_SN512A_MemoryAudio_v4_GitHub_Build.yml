          It changes source defaults, *not* any Android/data user configuration files.
          """
          from pathlib import Path
          
          GRAPHICS = Path('glue/rexglue-sdk-main/src/graphics/gta4_native/graphics_system.cpp')
          POOL = Path('glue/rexglue-sdk-main/src/graphics/gta4_native/native_bc_decode.h')
