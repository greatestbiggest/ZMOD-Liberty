                        lead + '{\n' +
                        lead + '  std::lock_guard<std::mutex> queue_guard(frames_mutex_);\n' +
                        lead + '  safely_queued = frames_queued_.size();\n' +
                        lead + '}\n' +
                        lead + 'REXAPU_DEBUG("SDLAudioDriver::SubmitFrame: frame_ptr={:08X} queued_count={}", frame_ptr,\n' +
